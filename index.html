<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pássaro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">

<title>Pássaro Rewards Mobile</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617;font-family:Arial,Helvetica,sans-serif;touch-action:none}
body{display:flex;justify-content:center;align-items:center}
#wrap{position:relative;width:100vw;height:100vh;max-width:none;max-height:none;overflow:hidden;background:#7dd3fc}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.panel{background:linear-gradient(#9a5a24,#5b3218);border:3px solid #3b2111;border-radius:12px;color:white;text-shadow:2px 2px #3b2111;box-shadow:0 4px 0 rgba(0,0,0,.3);font-weight:900;text-align:center}
.scorePanel{width:132px;padding:7px}.scorePanel .title{font-size:13px}.scorePanel .score{font-size:28px;margin:2px 0}.coinLine{color:#fde047;font-size:21px}
.bestPanel{width:112px;padding:7px;font-size:13px}.bestPanel strong{display:block;font-size:22px}
#pauseBtn{pointer-events:auto;width:54px;height:54px;border-radius:14px;border:3px solid #7c4a22;background:#fde68a;color:#5b2b12;font-size:25px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,.42);padding:20px;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.card{background:rgba(88,45,18,.97);border:4px solid #3b2111;border-radius:24px;color:white;text-align:center;padding:20px;max-width:390px;width:100%;text-shadow:2px 2px #3b2111;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.card h1{margin:0 0 10px;font-size:34px}.card p{line-height:1.42;margin:8px 0}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.menuBtn{border:0;border-radius:16px;padding:14px 17px;background:#facc15;color:#5b3218;font-weight:900;font-size:16px;cursor:pointer;min-width:120px}.menuBtn.alt{background:#93c5fd}.menuBtn.green{background:#22c55e;color:white}
.shop{display:grid;gap:8px;margin-top:12px}.shopItem{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:10px;text-align:left}
.shopItem small{display:block;color:#fde68a}.shopItem button{border:0;border-radius:10px;padding:10px 11px;background:#22c55e;color:white;font-weight:900}.shopItem button.locked{background:#64748b}
.tip{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(15,23,42,.55);color:white;padding:10px 14px;border-radius:14px;font-size:13px;border:1px solid rgba(255,255,255,.18);pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div class="hud">
  <div class="panel scorePanel"><div class="title">PONTUAÇÃO</div><div class="score" id="score">0</div><div class="coinLine">🪙 <span id="wallet">0</span></div></div>
  <button id="pauseBtn">Ⅱ</button>
  <div class="panel bestPanel">⭐ RECORDE <strong id="best">0</strong></div>
</div>
<div class="tip">Toque na tela para voar.</div>
<div class="overlay" id="overlay"><div class="card" id="card"></div></div>
</div>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=420,H=620,scale=1;
function resize(){
  W=innerWidth;H=innerHeight;
  if(!true){const maxW=520,maxH=920;W=Math.min(innerWidth,maxW);H=Math.min(innerHeight,maxH);}
  scale=devicePixelRatio||1;canvas.width=Math.floor(W*scale);canvas.height=Math.floor(H*scale);canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(scale,0,0,scale,0,0);
}
resize();addEventListener("resize",resize);

const scoreEl=document.getElementById("score"),walletEl=document.getElementById("wallet"),bestEl=document.getElementById("best"),overlay=document.getElementById("overlay"),card=document.getElementById("card"),pauseBtn=document.getElementById("pauseBtn");
let save;try{save=JSON.parse(localStorage.getItem("birdRewardsSave")||"")}catch(e){save=null}
if(!save)save={wallet:0,best:0,skin:"yellow",owned:["yellow"]};
const skins={
 yellow:{name:"Pássaro Amarelo",price:0,body:"#facc15",wing:"#f97316"},
 blue:{name:"Pássaro Azul",price:80,body:"#38bdf8",wing:"#2563eb"},
 red:{name:"Pássaro Vermelho",price:120,body:"#ef4444",wing:"#fb923c"},
 green:{name:"Pássaro Verde",price:160,body:"#22c55e",wing:"#16a34a"}
};
let state="menu",score=0,coinsRun=0,frames=0,speed=2.7,difficulty=1,revived=false,pipes=[],coins=[],clouds=[],particles=[];
const bird={x:95,y:260,r:17,vy:0,gravity:.42,jump:-7.3,rot:0,inv:0};
function persist(){localStorage.setItem("birdRewardsSave",JSON.stringify(save))}
function rand(a,b){return a+Math.random()*(b-a)}
function hud(){scoreEl.textContent=score;walletEl.textContent=save.wallet;bestEl.textContent=save.best}
function showMenu(){
 state="menu";overlay.style.display="flex";hud();
 card.innerHTML='<h1>Pássaro Rewards</h1><p>Voe entre os canos, colete moedas e compre novas cores.</p><p>O jogo acelera conforme sua pontuação aumenta.</p><p>Carteira: <b>🪙 '+save.wallet+'</b> | Recorde: <b>'+save.best+'</b></p><div class="row"><button class="menuBtn" id="playBtn">JOGAR</button><button class="menuBtn alt" id="shopBtn">LOJINHA</button></div><p style="font-size:12px;color:#fde68a">Para instalar no celular: abra pelo Safari/Chrome, toque em Compartilhar/Menu e escolha Adicionar à Tela de Início.</p>';
 document.getElementById("playBtn").onclick=start;document.getElementById("shopBtn").onclick=shop;
}
function shop(){
 let html='<h1>Lojinha</h1><p>Use moedas para trocar a cor do pássaro.</p><div class="shop">';
 Object.keys(skins).forEach(id=>{const s=skins[id],owned=save.owned.includes(id),sel=save.skin===id;html+='<div class="shopItem"><div><b>'+s.name+'</b><small>'+(owned?(sel?'Selecionado':'Comprado'):'Preço: 🪙 '+s.price)+'</small></div><button class="'+((owned||save.wallet>=s.price)?'':'locked')+'" data-skin="'+id+'">'+(owned?(sel?'OK':'Usar'):'Comprar')+'</button></div>'});
 html+='</div><div class="row"><button class="menuBtn" id="backBtn">VOLTAR</button></div>';card.innerHTML=html;
 document.getElementById("backBtn").onclick=showMenu;Array.from(card.querySelectorAll("[data-skin]")).forEach(b=>b.onclick=()=>buy(b.dataset.skin));
}
function buy(id){const s=skins[id];if(save.owned.includes(id)){save.skin=id;persist();shop();return}if(save.wallet>=s.price){save.wallet-=s.price;save.owned.push(id);save.skin=id;persist();hud();shop()}}
function start(){
 state="play";overlay.style.display="none";score=0;coinsRun=0;frames=0;speed=2.7;difficulty=1;revived=false;pipes=[];coins=[];particles=[];clouds=[];bird.x=W*.23;bird.y=H*.45;bird.vy=0;bird.inv=90;
 for(let i=0;i<8;i++)clouds.push({x:rand(0,W),y:rand(40,H-120),s:rand(.7,1.5),v:rand(.12,.35)});
 hud();
}
function flap(){if(state==="menu"||state==="over"){start();return}if(state==="play"){bird.vy=bird.jump;for(let i=0;i<5;i++)particles.push({x:bird.x-10,y:bird.y+5,vx:rand(-3,-1),vy:rand(-1,1),life:20})}}
function spawnPipe(){
 const gap=Math.max(H*.22, H*.32 - difficulty*8);
 const top=rand(75,H-gap-120);
 const w=Math.max(58,W*.13);
 const x=W+20;
 pipes.push({x,w,top,gap,passed:false});
 if(Math.random()<.82)coins.push({x:x+w/2,y:top+gap/2,r:13,taken:false});
}
function update(){
 if(state!=="play")return;frames++;
 difficulty=Math.min(7,1+score/18);
 speed=Math.min(7.2,2.7+score*.055);
 bird.vy+=bird.gravity;bird.y+=bird.vy;bird.rot=Math.max(-.55,Math.min(1.2,bird.vy/8));if(bird.inv>0)bird.inv--;
 if(frames%Math.max(62,96-Math.floor(difficulty*4))===0)spawnPipe();
 pipes.forEach(p=>{p.x-=speed;if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++;scoreEl.textContent=score}});
 pipes=pipes.filter(p=>p.x+p.w>-30);
 coins.forEach(c=>{c.x-=speed;if(!c.taken&&Math.hypot(bird.x-c.x,bird.y-c.y)<31){c.taken=true;coinsRun++;save.wallet++;score+=2;persist();hud();for(let i=0;i<8;i++)particles.push({x:c.x,y:c.y,vx:rand(-2,2),vy:rand(-2,2),life:25,gold:true})}});
 coins=coins.filter(c=>!c.taken&&c.x>-40);
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});particles=particles.filter(p=>p.life>0);
 clouds.forEach(c=>{c.x-=c.v*speed;if(c.x<-100){c.x=W+120;c.y=rand(50,H-140)}});
 if(bird.y-bird.r<0||bird.y+bird.r>H-72)gameOver("queda");
 for(const p of pipes){if(bird.inv<=0&&(circleRect(bird.x,bird.y,bird.r,p.x,0,p.w,p.top)||circleRect(bird.x,bird.y,bird.r,p.x,p.top+p.gap,p.w,H-72-(p.top+p.gap)))){gameOver("cano");break}}
}
function circleRect(cx,cy,cr,rx,ry,rw,rh){const x=Math.max(rx,Math.min(cx,rx+rw)),y=Math.max(ry,Math.min(cy,ry+rh)),dx=cx-x,dy=cy-y;return dx*dx+dy*dy<cr*cr}
function gameOver(reason){
 if(state!=="play")return;state="over";if(score>save.best){save.best=score;persist()}
 const can=save.wallet>=50&&!revived;overlay.style.display="flex";
 card.innerHTML='<h1>'+(score>=save.best?'Novo Recorde!':'Fim de jogo')+'</h1><p>'+(reason==="cano"?'Você bateu no cano!':'O pássaro caiu!')+'</p><p>Pontos: <b>'+score+'</b><br>Moedas da partida: <b>'+coinsRun+'</b><br>Carteira: <b>🪙 '+save.wallet+'</b></p><div class="row">'+(can?'<button class="menuBtn green" id="reviveBtn">REVIVER - 50 🪙</button>':'')+'<button class="menuBtn alt" id="againBtn">JOGAR DE NOVO</button><button class="menuBtn" id="menuBtn">MENU</button></div>';
 if(can)document.getElementById("reviveBtn").onclick=revive;document.getElementById("againBtn").onclick=start;document.getElementById("menuBtn").onclick=showMenu;hud();
}
function revive(){if(save.wallet<50||revived)return;save.wallet-=50;revived=true;persist();hud();bird.y=H*.45;bird.vy=bird.jump;bird.inv=160;pipes=[];coins=[];overlay.style.display="none";state="play"}
function draw(){
 sky();clouds.forEach(cloud);pipes.forEach(pipe);coins.forEach(c=>{if(!c.taken)coin(c)});ground();particles.forEach(effect);birdDraw();
}
function sky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#7dd3fc");g.addColorStop(.65,"#dbeafe");g.addColorStop(1,"#bfdbfe");ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function cloud(c){ctx.fillStyle="rgba(255,255,255,.78)";ctx.beginPath();ctx.arc(c.x,c.y,20*c.s,0,Math.PI*2);ctx.arc(c.x+24*c.s,c.y-8*c.s,27*c.s,0,Math.PI*2);ctx.arc(c.x+55*c.s,c.y,20*c.s,0,Math.PI*2);ctx.arc(c.x+28*c.s,c.y+12*c.s,22*c.s,0,Math.PI*2);ctx.fill()}
function pipe(p){ctx.fillStyle="#16a34a";ctx.fillRect(p.x,0,p.w,p.top);ctx.fillRect(p.x,p.top+p.gap,p.w,H-72-(p.top+p.gap));ctx.fillStyle="#22c55e";ctx.fillRect(p.x-6,p.top-20,p.w+12,20);ctx.fillRect(p.x-6,p.top+p.gap,p.w+12,20);ctx.fillStyle="rgba(255,255,255,.18)";ctx.fillRect(p.x+8,0,10,p.top-26);ctx.fillRect(p.x+8,p.top+p.gap+24,10,H-72-(p.top+p.gap+24))}
function ground(){const gy=H-72;ctx.fillStyle="#22c55e";ctx.fillRect(0,gy,W,72);ctx.fillStyle="#16a34a";for(let x=-40+(frames*speed%40);x<W;x+=40){ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+20,gy+18);ctx.lineTo(x+40,gy);ctx.fill()}ctx.fillStyle="#854d0e";ctx.fillRect(0,gy+38,W,34)}
function coin(c){ctx.save();ctx.translate(c.x,c.y);ctx.fillStyle="#facc15";ctx.beginPath();ctx.ellipse(0,0,12,16,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#ca8a04";ctx.lineWidth=4;ctx.stroke();ctx.restore()}
function effect(p){ctx.fillStyle=p.gold?"rgba(250,204,21,"+(p.life/25)+")":"rgba(250,204,21,"+(p.life/20)+")";ctx.beginPath();ctx.arc(p.x,p.y,p.gold?3:2.5,0,Math.PI*2);ctx.fill()}
function birdDraw(){const sk=skins[save.skin]||skins.yellow;ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);if(bird.inv>0&&Math.floor(bird.inv/8)%2===0)ctx.globalAlpha=.45;ctx.fillStyle=sk.body;ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.fill();ctx.fillStyle=sk.wing;ctx.beginPath();ctx.ellipse(-8,7,10,6,-.4,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fb923c";ctx.beginPath();ctx.moveTo(15,-2);ctx.lineTo(31,4);ctx.lineTo(15,10);ctx.closePath();ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(8,-7,6,0,Math.PI*2);ctx.fill();ctx.fillStyle="#020617";ctx.beginPath();ctx.arc(10,-7,2.5,0,Math.PI*2);ctx.fill();ctx.restore()}
function loop(){update();draw();requestAnimationFrame(loop)}
pauseBtn.onclick=function(){if(state==="play"){state="pause";overlay.style.display="flex";card.innerHTML='<h1>Pausado</h1><p>Clique para continuar.</p><div class="row"><button class="menuBtn" id="contBtn">CONTINUAR</button><button class="menuBtn alt" id="pauseMenuBtn">MENU</button></div>';document.getElementById("contBtn").onclick=()=>{state="play";overlay.style.display="none"};document.getElementById("pauseMenuBtn").onclick=showMenu}};
document.addEventListener("keydown",e=>{if(e.code==="Space"||e.key==="ArrowUp"){e.preventDefault();flap()}});
canvas.addEventListener("pointerdown",e=>{e.preventDefault();flap()});
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
showMenu();loop();
</script>
</body>
</html>
