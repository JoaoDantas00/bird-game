function todayKey(){

 return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}

}

let audioCtx=null;
function beep(freq,dur){
 if(!save.sound)return;
 try{
  audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.value=.035;o.start();setTimeout(()=>o.stop(),dur);
 }catch(e){}
}

function rewardGift(reason){
 const hard=trophyList().filter(t=>t.ok).length;
 const bonus=hard>=15?2:hard>=8?1:0;
 const pool=[
  {type:"coins",amount:25+bonus*25,label:(25+bonus*25)+" moedas 🪙"},
  {type:"coins",amount:50+bonus*35,label:(50+bonus*35)+" moedas 🪙"},
  {type:"key",amount:1+bonus,label:(1+bonus)+" chave(s) 🔑"},
  {type:"shield",amount:1+bonus,label:(1+bonus)+" escudo(s) 🛡️"},
  {type:"heart",amount:1+bonus,label:(1+bonus)+" vida(s) ❤️"},
  {type:"slow",amount:1+bonus,label:(1+bonus)+" tartaruga(s) 🐢"},
  {type:"magnet",amount:1+bonus,label:(1+bonus)+" ímã(s) 🧲"}
 ];
 const reward=pool[Math.floor(Math.random()*pool.length)];
 if(reward.type==="coins")save.wallet+=reward.amount;
 if(reward.type==="key")save.keys+=reward.amount;
 if(["shield","heart","slow","magnet"].includes(reward.type)){save.inventory[reward.type]=(save.inventory[reward.type]||0)+reward.amount;save.powerStats[reward.type]=(save.powerStats[reward.type]||0)+reward.amount;}
 save.gifts.push({reason:reason,label:reward.label,date:new Date().toLocaleDateString()});
 persist();hud();
 return reward;
}

function move(a,s){a.forEach(c=>c.x-=s)}function applyPower(t){if(t==="heart"){lives=Math.min(5,lives+1);hud();showPower("❤️ +1 VIDA")} if(t==="shield"){shield=520;showPower("🛡️ ESCUDO")} if(t==="magnet"){magnet=520;showPower("🧲 ÍMÃ")} if(t==="slow"){slow=430;showPower("🐢 LENTO")}}
function burst(x,y,gold){for(let i=0;i<9;i++)particles.push({x,y,vx:rand(-2.5,2.5),vy:rand(-2.5,2.5),life:25,gold})}
function hitDanger(reason){if(bird.inv>0)return;if(shield>0){shield=0;bird.inv=80;showPower("🛡️ DEFENDEU!");return}lives--;hud();if(lives>0){bird.y=H*.45;bird.vy=bird.jump;bird.inv=115;showPower("❤️ -1 VIDA")}else gameOver(reason)}
function circleRect(cx,cy,cr,rx,ry,rw,rh){const x=Math.max(rx,Math.min(cx,rx+rw)),y=Math.max(ry,Math.min(cy,ry+rh)),dx=cx-x,dy=cy-y;return dx*dx+dy*dy<cr*cr}
function gameOver(reason){if(state!=="play")return;state="over";save.xp+=score+coinsRun*2+keysRun*10;while(save.xp>=save.level*180){save.xp-=save.level*180;save.level++;save.wallet+=25}if(keysRun>save.maxKeysRun)save.maxKeysRun=keysRun;if(coinsRun>save.maxCoinsRun)save.maxCoinsRun=coinsRun;if(score>save.daily.score)save.daily.score=score;if(score>save.best)save.best=score;updateRanking();persist();beep(180,110);const canCoin=save.wallet>=50&&!revived,canKey=save.keys>=1&&!revived;overlay.style.display="flex";card.innerHTML='<h1>'+(score>=save.best?'Novo Recorde!':'Fim de jogo')+'</h1><p>'+(reason==="cano"?'Você bateu no cano!':'O pássaro caiu!')+'</p><p>Pontos: <b>'+score+'</b><br>Moedas: <b>'+coinsRun+'</b> | Chaves: <b>'+keysRun+'</b><br>Carteira: <b>🪙 '+save.wallet+'</b> 🔑 <b>'+save.keys+'</b><br>Nível: <b>'+save.level+'</b></p><div class="row">'+(canCoin?'<button class="menuBtn green" id="reviveCoin">REVIVER - 50 🪙</button>':'')+(canKey?'<button class="menuBtn green" id="reviveKey">REVIVER - 1 🔑</button>':'')+'<button class="menuBtn alt" id="againBtn">JOGAR DE NOVO</button><button class="menuBtn" id="menuBtn">MENU</button></div>';if(canCoin)document.getElementById("reviveCoin").onclick=()=>revive("coin");if(canKey)document.getElementById("reviveKey").onclick=()=>revive("key");document.getElementById("againBtn").onclick=start;document.getElementById("menuBtn").onclick=showMenu;hud();}
function revive(type){if(revived)return;if(type==="coin"){if(save.wallet<50)return;save.wallet-=50}else{if(save.keys<1)return;save.keys--}revived=true;save.revives++;persist();hud();lives=1;bird.y=H*.45;bird.vy=bird.jump;bird.inv=170;pipes=[];coins=[];keys=[];powerups=[];hazards=[];overlay.style.display="none";state="play"}
function draw(){sky();backgroundDetails();clouds.forEach(cloud);pipes.forEach(pipe);hazards.forEach(hazardDraw);coins.forEach(coin);keys.forEach(keyDraw);powerups.forEach(powerDraw);ground();particles.forEach(effect);birdDraw();}
function theme(){return themes[save.theme]||themes.sky}
function sky(){const t=theme(),g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,t.top);g.addColorStop(.6,t.mid);g.addColorStop(1,t.bottom);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function backgroundDetails(){const t=theme();if(t.night){} if(save.theme==="night"){ctx.fillStyle="rgba(255,255,255,.85)";for(let i=0;i<45;i++){ctx.fillRect((i*83+frames*.08)%W,(i*47)%Math.max(100,H-100),2,2)}ctx.fillStyle="#fef3c7";ctx.beginPath();ctx.arc(W-75,95,28,0,Math.PI*2);ctx.fill()} if(t.city){for(let i=0;i<9;i++){let bw=W/9+8,bh=rand(90,220),x=i*(W/8)-20,y=H-72-bh;ctx.fillStyle=i%2?"#334155":"#475569";ctx.fillRect(x,y,bw,bh);ctx.fillStyle="#fde68a";for(let yy=y+20;yy<H-90;yy+=28)for(let xx=x+12;xx<x+bw-10;xx+=22)ctx.fillRect(xx,yy,8,10)}} if(t.fire){ctx.fillStyle="rgba(249,115,22,.25)";for(let i=0;i<12;i++){ctx.beginPath();ctx.arc((i*57+frames*.6)%W,H-90-rand(0,80),rand(18,38),0,Math.PI*2);ctx.fill()}} if(t.zombie){ctx.fillStyle="rgba(20,83,45,.45)";for(let i=0;i<8;i++){ctx.beginPath();ctx.arc(i*70,H-90,45,0,Math.PI*2);ctx.fill()}}}
function cloud(c){if(save.theme==="fire"||save.theme==="zombie")ctx.fillStyle="rgba(0,0,0,.25)";else ctx.fillStyle="rgba(255,255,255,.72)";ctx.beginPath();ctx.arc(c.x,c.y,20*c.s,0,Math.PI*2);ctx.arc(c.x+24*c.s,c.y-8*c.s,27*c.s,0,Math.PI*2);ctx.arc(c.x+55*c.s,c.y,20*c.s,0,Math.PI*2);ctx.arc(c.x+28*c.s,c.y+12*c.s,22*c.s,0,Math.PI*2);ctx.fill()}
function pipe(p){const t=theme();ctx.fillStyle=t.pipe;ctx.fillRect(p.x,0,p.w,p.top);ctx.fillRect(p.x,p.top+p.gap,p.w,H-72-(p.top+p.gap));ctx.fillStyle=t.pipe2;ctx.fillRect(p.x-6,p.top-20,p.w+12,20);ctx.fillRect(p.x-6,p.top+p.gap,p.w+12,20);ctx.fillStyle="rgba(255,255,255,.14)";ctx.fillRect(p.x+8,0,10,p.top-26);ctx.fillRect(p.x+8,p.top+p.gap+24,10,H-72-(p.top+p.gap+24))}
function ground(){const gy=H-72,t=theme();ctx.fillStyle=t.pipe2;ctx.fillRect(0,gy,W,72);ctx.fillStyle=t.pipe;for(let x=-40+(frames*speed%40);x<W;x+=40){ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+20,gy+18);ctx.lineTo(x+40,gy);ctx.fill()}ctx.fillStyle=save.theme==="fire"?"#451a03":"#854d0e";ctx.fillRect(0,gy+38,W,34)}

function hazardDraw(h){
 ctx.save();ctx.translate(h.x,h.y);ctx.textAlign="center";ctx.textBaseline="middle";
 if(h.type==="fireball"){ctx.fillStyle="#f97316";ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ef4444";ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(-45,-12);ctx.lineTo(-32,12);ctx.closePath();ctx.fill();}
 else if(h.type==="zombiehand"){ctx.font="34px Arial";ctx.fillText("🧟",0,0)}
 else if(h.type==="branch"){ctx.fillStyle="#78350f";ctx.fillRect(-35,-8,70,16);ctx.fillStyle="#22c55e";ctx.beginPath();ctx.arc(15,-12,18,0,Math.PI*2);ctx.fill();}
 else if(h.type==="ball"){ctx.font="30px Arial";ctx.fillText("⚽",0,0)}
 else if(h.type==="meteor"){ctx.font="34px Arial";ctx.fillText("☄️",0,0)}
 else if(h.type==="arrow"){ctx.font="32px Arial";ctx.fillText("➳",0,0)}
 else if(h.type==="jelly"){ctx.font="34px Arial";ctx.fillText("🪼",0,0)}
 ctx.restore();
}

function coin(c){ctx.save();ctx.translate(c.x,c.y);ctx.fillStyle="#facc15";ctx.beginPath();ctx.ellipse(0,0,12,16,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#ca8a04";ctx.lineWidth=4;ctx.stroke();ctx.restore()}
function keyDraw(k){ctx.save();ctx.translate(k.x,k.y);ctx.font="28px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("🔑",0,0);ctx.restore()}
function powerDraw(p){ctx.save();ctx.translate(p.x,p.y);ctx.font="28px Arial";ctx.textAlign="center";ctx.textBaseline="middle";let icon=p.type==="heart"?"❤️":p.type==="shield"?"🛡️":p.type==="magnet"?"🧲":"🐢";ctx.fillText(icon,0,0);ctx.restore()}
function effect(p){ctx.fillStyle=p.gold?"rgba(250,204,21,"+(p.life/25)+")":"rgba(250,204,21,"+(p.life/20)+")";ctx.beginPath();ctx.arc(p.x,p.y,p.gold?3:2.5,0,Math.PI*2);ctx.fill()}
function birdDraw(){const sk=skins[save.skin]||skins.yellow;ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);if(bird.inv>0&&Math.floor(bird.inv/8)%2===0)ctx.globalAlpha=.45;if(shield>0){ctx.strokeStyle="rgba(59,130,246,.7)";ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,bird.r+10,0,Math.PI*2);ctx.stroke()}ctx.fillStyle=sk.body;ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.fill();if(sk.stripe){ctx.strokeStyle="#111827";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-9,-14);ctx.lineTo(7,14);ctx.stroke();ctx.beginPath();ctx.moveTo(8,-14);ctx.lineTo(-5,15);ctx.stroke()}if(save.skin==="gold"){ctx.fillStyle="rgba(255,255,255,.8)";ctx.beginPath();ctx.arc(-6,-6,3,0,Math.PI*2);ctx.fill()}ctx.fillStyle=sk.wing;ctx.beginPath();ctx.ellipse(-8,7,10,6,-.4,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fb923c";ctx.beginPath();ctx.moveTo(15,-2);ctx.lineTo(31,4);ctx.lineTo(15,10);ctx.closePath();ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(8,-7,6,0,Math.PI*2);ctx.fill();ctx.fillStyle="#020617";ctx.beginPath();ctx.arc(10,-7,2.5,0,Math.PI*2);ctx.fill();ctx.restore()}
function loop(){update();draw();requestAnimationFrame(loop)}
pauseBtn.onclick=function(){if(state==="play"){state="pause";overlay.style.display="flex";card.innerHTML='<h1>Pausado</h1><p>Clique para continuar.</p><div class="row"><button class="menuBtn" id="contBtn">CONTINUAR</button><button class="menuBtn alt" id="pauseMenuBtn">MENU</button></div>';document.getElementById("contBtn").onclick=()=>{state="play";overlay.style.display="none"};document.getElementById("pauseMenuBtn").onclick=showMenu}};
document.addEventListener("keydown",e=>{if(e.code==="Space"||e.key==="ArrowUp"){e.preventDefault();flap()}});
canvas.addEventListener("pointerdown",e=>{e.preventDefault();flap()});
document.addEventListener("touchmove",e=>{if(!e.target.closest(".card"))e.preventDefault();},{passive:false});
applyBrightness();showMenu();loop();
</script>
</body>
</html>
